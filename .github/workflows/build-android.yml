name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME="0.2.$CODE"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}+${CODE}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install Godot
        run: |
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_RELEASE }}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo mv "/tmp/Godot_v${{ env.GODOT_RELEASE }}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install Godot Android export templates
        run: |
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_RELEASE }}_export_templates.tpz"
          TARGET="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          mkdir -p "$TARGET"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TARGET/"
          ls "$TARGET" | head -10

      - name: Configure Godot editor settings (Android SDK + debug keystore)
        run: |
          # Godot's Android export validates that android_sdk_path and a debug_keystore
          # are set in editor settings, even for --export-release. Without this the
          # headless export fails with "Cannot export project with preset 'Android' due
          # to configuration errors" and no further detail.
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$DEBUG_KEYSTORE" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$CONFIG_DIR"
          cat > "$CONFIG_DIR/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$DEBUG_KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty. Add it under Settings > Secrets > Actions."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Inject version + signing into project
        env:
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Bump versionName in project settings
          sed -i "s|^config/version=.*|config/version=\"$NAME\"|" godot/project.godot

          # Write versionCode for the runtime Version singleton to read
          cat > godot/data/version.cfg <<EOF
          ; Generated by CI at export time.
          [version]
          code=$CODE
          EOF

          # Inject keystore into export preset (replaces committed placeholders)
          sed -i \
            -e "s|HOMEBREWER_KEYSTORE_PATH_PLACEHOLDER|$KEYSTORE_PATH|g" \
            -e "s|HOMEBREWER_KEY_ALIAS_PLACEHOLDER|$KEY_ALIAS|g" \
            -e "s|HOMEBREWER_KEY_PASSWORD_PLACEHOLDER|$KEY_PASSWORD|g" \
            godot/export_presets.cfg

          # Android needs versionCode/versionName baked into the manifest
          sed -i "s|^version/code=.*|version/code=$CODE|" godot/export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"$NAME\"|" godot/export_presets.cfg

      - name: Import resources
        working-directory: godot
        run: godot --headless --import

      - name: Export release APK
        working-directory: godot
        run: |
          mkdir -p ../build
          godot --headless --export-release "Android" ../build/homebrewer.apk
          ls -la ../build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrewer-apk
          path: build/homebrewer.apk

      - name: Publish auto-release (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})
          files: build/homebrewer.apk
          body: |
            Automated release from commit ${{ github.sha }}.

      - name: Attach APK to manual tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/homebrewer.apk

      - name: Set up Python
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send FCM update push (best-effort)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "FCM_SERVICE_ACCOUNT_JSON not set; skipping push."
            exit 0
          fi
          pip install --quiet google-auth google-auth-httplib2 requests
          python scripts/send_fcm_update_push.py "$NAME" "$CODE" || \
            echo "::warning::FCM push failed; release artifact is still published."
